resources:
  jobs:
    ealh_dev_lakehouse_job:
      name: ealh-dev-lakehouse-job

      parameters:
        - name: load_date
          default: "2026-08-01"
        - name: batch_id
          default: "manual_20260801_001"

      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/bronze/01_bronze_ingestion
            base_parameters:
              catalog: ealh_dev
              storage_account: stsubhashealhdev001
              source_system: azuresql_sales
              load_date: "{{job.parameters.load_date}}"
              batch_id: "{{job.parameters.batch_id}}"

        - task_key: bronze_dq_checks
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/quality/02_bronze_dq_checks
            base_parameters:
              catalog: ealh_dev
              batch_id: "{{job.parameters.batch_id}}"

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_dq_checks
          notebook_task:
            notebook_path: ../notebooks/silver/01_silver_transform
            base_parameters:
              catalog: ealh_dev
              storage_account: stsubhashealhdev001
              source_system: azuresql_sales
              batch_id: "{{job.parameters.batch_id}}"

        - task_key: gold_aggregations
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ../notebooks/gold/01_gold_aggregations
            base_parameters:
              catalog: ealh_dev
              storage_account: stsubhashealhdev001
              source_system: azuresql_sales
