resources:
  jobs:
    ealh_dev_lakehouse_job:
      name: ealh-dev-lakehouse-job

      parameters:
        - name: load_date
          default: "2026-08-02"
        - name: batch_id
          default: "manual_bundle_test"
        - name: run_id
          default: "manual_bundle_test"

      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../../databricks/notebooks/bronze/01_bronze_ingestion.py
            base_parameters:
              catalog: ealh_dev
              storage_account: stsubhashealhdev001
              source_system: azuresql_sales
              load_date: "{{job.parameters.load_date}}"
              batch_id: "{{job.parameters.batch_id}}"

        - task_key: bronze_dq_checks
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../../databricks/notebooks/quality/02_bronze_dq_checks.py
            base_parameters:
              catalog: ealh_dev
              batch_id: "{{job.parameters.batch_id}}"

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_dq_checks
          notebook_task:
            notebook_path: ../../databricks/notebooks/silver/01_silver_transform.py
            base_parameters:
              catalog: ealh_dev
              storage_account: stsubhashealhdev001
              source_system: azuresql_sales
              batch_id: "{{job.parameters.batch_id}}"

        - task_key: silver_dq_checks
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ../../databricks/notebooks/quality/03_silver_dq_checks.py
            base_parameters:
              catalog: ealh_dev
              batch_id: "{{job.parameters.batch_id}}"
              run_id: "{{job.parameters.run_id}}"

        - task_key: gold_star_schema
          depends_on:
            - task_key: silver_dq_checks
          notebook_task:
            notebook_path: ../../databricks/notebooks/gold/02_gold_star_schema.py
            base_parameters:
              catalog: ealh_dev
              storage_account: stsubhashealhdev001
              source_system: azuresql_sales
              batch_id: "{{job.parameters.batch_id}}"

        - task_key: gold_aggregations
          depends_on:
            - task_key: gold_star_schema
          notebook_task:
            notebook_path: ../../databricks/notebooks/gold/01_gold_aggregations.py
            base_parameters:
              catalog: ealh_dev
              storage_account: stsubhashealhdev001
              source_system: azuresql_sales

        - task_key: gold_dq_checks
          depends_on:
            - task_key: gold_aggregations
          notebook_task:
            notebook_path: ../../databricks/notebooks/quality/04_gold_dq_checks.py
            base_parameters:
              catalog: ealh_dev
              batch_id: "{{job.parameters.batch_id}}"
              run_id: "{{job.parameters.run_id}}"